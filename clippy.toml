# Restriction lints (`unwrap_used` / `expect_used` / `panic`) are warn-level
# workspace-wide (see Cargo.toml `[workspace.lints.clippy]`) so production
# panic points need an explicit `#[expect(…, reason = "…")]`. Tests panic on
# assertion failure by design, so allow the three there.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
# Every `$HOME` lookup goes through `fuz_sys::home_dir`, which refuses an empty
# or relative home; std's own reads an empty `HOME` as unset and substitutes
# the password database's home.
#
# The request-reads census: a handler reads its query through
# `fuz_http::read_query_pairs` over axum's `RawQuery`, and its path params
# through `fuz_http::RouteParams` — the spine's strict readers, which refuse an
# escape that doesn't decode, where axum's extractors and `form_urlencoded`
# leave it as text or write U+FFFD. Clippy resolves the paths, so an aliased or
# grouped import is caught. A path whose crate a linted crate doesn't link is
# skipped silently, but a misspelled item in a linked crate is only a warning
# that `-D warnings` does not promote, so the spine's shared census
# (`fuz_testing::request_reads_census`, run by
# `fuz_forge_server/tests/request_reads_census.rs`) pins each spelling.
disallowed-methods = [
    { path = "std::env::home_dir", reason = "use fuz_sys::home_dir: it refuses an empty or relative HOME" },
    { path = "form_urlencoded::parse", reason = "a lossy query read: use fuz_http::read_query_pairs over RawQuery" },
    { path = "url::Url::query_pairs", reason = "a lossy query read: use fuz_http::read_query_pairs over RawQuery" },
]
disallowed-types = [
    { path = "axum::extract::Path", reason = "a lenient path-param read: use fuz_http::RouteParams" },
    { path = "axum::extract::RawPathParams", reason = "a lenient path-param read: use fuz_http::RouteParams" },
    { path = "axum::extract::Query", reason = "a lossy query read: use fuz_http::read_query_pairs over RawQuery" },
    { path = "axum::extract::Form", reason = "a lossy form read (the query, on GET): use fuz_http::read_query_pairs over RawQuery" },
]
