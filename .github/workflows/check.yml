# Checks the Rust server and CLI, and the TypeScript server and site.
#
# Two jobs:
#
# - `rust` — format, lint, tests (the DB suites on pglet, in-process, through
#   `fuz_testing::fresh_test_db`), then the PostgreSQL leg: every DB test
#   again, the Postgres-only ones included, each in a database of its own on a
#   Postgres service. Then the release dep-graph audit (`cargo xtask
#   check-release` — keeps `fuz_testing`, `fuz_audit`, and test-only features
#   off the `fuzf` / `fuzfd` release graph), and rustdoc held at zero warnings.
# - `ts` — `gro check` (types, tests, format, lint, and the static site build),
#   against a Postgres service for the DB-backed tests.
#
# Not run here: the cross-backend vitest projects, which spawn both backends
# (`FUZ_TEST_CROSS_BACKEND=1`, src/test/CLAUDE.md).
#
# Layout: the Rust workspace path-depends on the spine crates in the sibling
# `fuz` repository (`../fuz/crates/*`), and `fuz_testing` path-depends on the
# pglet server in the sibling `pglet` repository (`../pglet/crates/*`).
# `actions/checkout` can't write outside `$GITHUB_WORKSPACE`, so every checkout
# goes into a subdirectory — `fuz_forge/`, `fuz/`, `pglet/` — and every `run`
# step works in `fuz_forge/` unless it says otherwise. The sibling checkouts
# need those repositories public (or a token).

name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: ['**']
  # Allow manually re-running the check from the Actions tab.
  workflow_dispatch:

# Cancel a PR's in-progress run when a new commit supersedes it; let main-branch
# runs finish so every push to main stays verified. Note that is per *push*, not
# per commit: a push of several commits is checked at its tip only.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: the checks only read the repo.
permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fuz_forge_test
          POSTGRES_PASSWORD: fuz_forge_test
          POSTGRES_DB: fuz_forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # `FUZ_REF` and `PGLET_REF` are the `fuz` and `pglet` commits the forge is
    # checked against: both checked out at `main`, so the three move together.
    env:
      FUZ_REF: main
      PGLET_REF: main

    defaults:
      run:
        working-directory: fuz_forge

    steps:
      # persist-credentials: false keeps the GITHUB_TOKEN out of .git/config (no step here pushes via git).
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: fuz_forge
          persist-credentials: false

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: fuzdev/fuz
          ref: ${{ env.FUZ_REF }}
          path: fuz
          persist-credentials: false

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: fuzdev/pglet
          ref: ${{ env.PGLET_REF }}
          path: pglet
          persist-credentials: false

      # The toolchain is pinned in rust-toolchain.toml, not `stable`: the
      # workspace runs `clippy::nursery` at warn and this job denies warnings,
      # so a floating toolchain would fail CI whenever a new Rust release adds a
      # nursery lint. Bump the file deliberately, with fuz's. Any rustup 1.28+
      # reads the file with no arguments, so skip self-updating it. It runs in
      # `fuz_forge/`, so it reads this repo's file; the `fuz` path crates build
      # under that same toolchain.
      - name: Install Rust
        run: |
          rustup toolchain install --no-self-update
          rustup show active-toolchain
          cargo --version

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: fuz_forge -> target

      # Every workspace package named, never `--all`: rustfmt follows path
      # dependencies, so `--all` would check the `fuz` checkout's files too.
      - name: Format
        run: cargo fmt -p fuz_forge -p fuz_forge_server -p fuz_forge_wire -p testing_fuz_forge_server -p xtask --check

      # `--locked` holds the committed lockfile, which records the `fuz` and
      # `pglet` path crates with their versions and dependencies, so a version
      # bump or dependency change at `FUZ_REF` or `PGLET_REF` fails here until
      # `Cargo.lock` is updated.
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --workspace

      # The PostgreSQL leg. `--include-ignored`: every DB test, and the
      # Postgres-only ones beside them. Each test creates a database of its own
      # through this server and role and drops it after
      # (`fuz_testing::fresh_test_db`), so they run in parallel; the service's
      # user is a superuser, so it has `CREATEDB`.
      - name: Test (Postgres)
        env:
          FUZ_TEST_POSTGRES_URL: postgres://fuz_forge_test:fuz_forge_test@localhost:5432/fuz_forge_test
        run: cargo test --locked -p fuz_forge_server -- --include-ignored

      - name: Release dep-graph audit
        run: cargo xtask check-release

      # `-D warnings`, not a warning count against a baseline: `cargo doc` is
      # incremental, so a count taken against a warm target dir can read lower
      # than the baseline. Hard zero is immune.
      #
      # `--document-private-items` because rustdoc only checks the docs of the
      # items it documents. `private_intra_doc_links` is allowed in Cargo.toml:
      # module headers point at private members on purpose, and this mode
      # documents them.
      #
      # `--no-deps` keeps the `fuz` path crates out (fuz's own CI documents them).
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --no-deps --document-private-items

  ts:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fuz_forge_test
          POSTGRES_PASSWORD: fuz_forge_test
          POSTGRES_DB: fuz_forge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgres://fuz_forge_test:fuz_forge_test@localhost:5432/fuz_forge_test

    defaults:
      run:
        working-directory: fuz_forge

    steps:
      # persist-credentials: false keeps the GITHUB_TOKEN out of .git/config (no step here pushes via git).
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          path: fuz_forge
          persist-credentials: false

      - name: Use Node.js 24.14
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.14'
          cache: npm
          cache-dependency-path: fuz_forge/package-lock.json

      - run: npm ci

      # `npx @fuzdev/gro`, as the ecosystem's other repos run it in CI: gro is
      # a devDependency here, so `npx` resolves the version `npm ci` just
      # installed. `--workspace` fails on a dirty git tree; `--build` adds the
      # site build. With no `fuz` checkout beside the repo, the build's cargo
      # step skips with a warning (gro.config.ts) — the `rust` job covers the
      # binaries.
      - name: gro check
        run: npx @fuzdev/gro check --workspace --build
